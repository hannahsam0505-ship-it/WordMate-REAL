      registryWriteProtected:d.writable===false,
      registryDeleteProtected:d.configurable===false,
      exactSpeedReferences:exactReferences===true && currentExact,
      singleIframe:rules.singleIframe===true,
      eagerIframe:rules.eagerIframe===true,
      noFetchInCriticalPath:rules.noFetchInCriticalPath===true,
      noTimerInCriticalPath:rules.noTimerInCriticalPath===true,
      noLockNetworkCall:rules.noLockNetworkCall===true,
      noLockDbRead:rules.noLockDbRead===true,
      noLockTimer:rules.noLockTimer===true,
      noLockRepeatedEvent:rules.noLockRepeatedEvent===true
    };
    status.verified=Object.keys(status).every(function(key){
      return key==='verified' || status[key]===true;
    });
    return status;
  }

  function wmLogMapframeSpeedLockStatus(){
    const s=wmGetMapframeSpeedLockStatus();
    console.group('🔒 WORD MATE MAPFRAME SPEED LOCK STATUS');
    console.log('LOCK VERSION : '+VERSION);
    console.log('LOCK DATE    : '+DATE);
    console.table(s);
    console.log(s.verified?'🔒 MAPFRAME SPEED ALL LOCK VERIFIED':'⚠️ MAPFRAME SPEED LOCK CHECK REQUIRED');
    console.groupEnd();
    return s;
  }

  Object.defineProperty(window,'wmGetMapframeSpeedLockStatus',{
    value:wmGetMapframeSpeedLockStatus,writable:false,configurable:false
  });
  Object.defineProperty(window,'wmLogMapframeSpeedLockStatus',{
    value:wmLogMapframeSpeedLockStatus,writable:false,configurable:false
  });

  wmLogMapframeSpeedLockStatus();
})();
