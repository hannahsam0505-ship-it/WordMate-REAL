<script>
  window.wmStudentLogin = async function() {
    const studentId = document.getElementById("wmStudentId").value.trim();
    const password = document.getElementById("wmStudentPw").value.trim();

    const msg = document.getElementById("wmLoginMessage");
    const result = document.getElementById("wmLoginResult");
    const btn = document.getElementById("wmLoginBtn");

    msg.style.color = "red";
    msg.textContent = "";
    result.style.display = "none";
    result.innerHTML = "";

    if (!studentId || !password) {
      msg.textContent = "학생ID와 비밀번호를 입력하세요.";
      return;
    }

    btn.disabled = true;
    btn.textContent = "로그인 중...";

    /* WM_LOGIN_FIVE_FIELDS_DIRECT_V1_20260827
       브라우저는 학생ID + 비밀번호 + 접속기기만 전달합니다.
       서버는 해당 ID의 비밀번호 / 활성상태 확인 후 현재세션 / 세션상태 / 접속기기를 갱신합니다. */
    const url = WM_STUDENT_LOGIN_API_URL
      + "?mode=studentLogin"
      + "&studentId=" + encodeURIComponent(studentId)
      + "&password=" + encodeURIComponent(password)
      + "&deviceInfo=" + encodeURIComponent(navigator.userAgent || "")
      + "&t=" + Date.now();

    try {
      const res = await fetch(url, { cache: "no-store" });
      const data = await res.json();

      if (!data || !data.success) {
        msg.textContent = (data && data.message) || "로그인 실패";
        return;
      }

      const sessionToken = String(data.sessionToken || (data.student && data.student.현재세션) || "");
      if (!sessionToken) {
        msg.textContent = "세션 발급에 실패했습니다.";
        return;
      }

      const s = {
        학생ID: String((data.student && data.student.학생ID) || studentId).trim(),
        현재세션: sessionToken,
        sessionToken: sessionToken,
        wmSessionToken: sessionToken
      };

      try {
        sessionStorage.setItem("WM_STUDENT_ID", s.학생ID);
        sessionStorage.setItem("WM_SESSION_TOKEN", sessionToken);
        localStorage.setItem("WM_SESSION_TOKEN", sessionToken);
        sessionStorage.setItem("wmLoggedInStudent", JSON.stringify(s));
        localStorage.setItem("wmLoggedInStudent", JSON.stringify(s));
      } catch (storageErr) {}

      window.WM_LOGGED_IN_STUDENT = s;

      msg.style.color = "green";
      msg.textContent = "로그인 성공";
      btn.textContent = "학습맵 이동 중...";

      wmOpenLearningMap();
    } catch (e) {
      msg.textContent = "서버 연결 오류";
    } finally {
      btn.disabled = false;
      btn.textContent = "로그인";
    }
  }


  function wmBuildInitialSetId(learningAssign) {
    const text = String(learningAssign || "");
    const match = text.match(/(\d+)/);
    if (!match) return "5-1-1";
    return Number(match[1]) + "-1-1";
  }

  function wmNormalizeSetIdForStudy(setId) {
    const text = String(setId || "").trim().toUpperCase();

    if (/^WM\d+-\d+-\d+$/.test(text)) {
      return text;
    }

    if (/^\d+-\d+-\d+$/.test(text)) {
      return "WM" + text;
    }

    return "WM4-1-1";
  }

  function wmEncodeStudentPayload(student) {
    const payload = JSON.stringify({
      학생ID: student.학생ID || "",
      학생이름: student.학생이름 || "",
      학교: student.학교 || "",
      학년: student.학년 || "",
      Class: student.Class || student.반명 || "",
      반명: student.반명 || student.Class || "",
      교사명: student.교사명 || "",
      학습배정: student.학습배정 || "",
      현재세트: student.현재세트 || wmBuildInitialSetId(student.학습배정) || "4-1-1",
      현재세션: student.현재세션 || student.sessionToken || student.wmSessionToken || "",
      sessionToken: student.sessionToken || student.현재세션 || student.wmSessionToken || "",
      wmSessionToken: student.wmSessionToken || student.sessionToken || student.현재세션 || ""
    });

    try {
      return btoa(unescape(encodeURIComponent(payload)));
    } catch (err) {
      return "";
    }
  }

  function wmOpenLearningMap() {
    const s = window.WM_LOGGED_IN_STUDENT;

    if (!s || !s.학생ID) {
      alert("로그인 정보가 없습니다. 다시 로그인해 주세요.");
      return;
    }

    const studentId = String(s.학생ID || "").trim();
    const sessionToken = String(
      s.sessionToken ||
      s.현재세션 ||
      s.wmSessionToken ||
      sessionStorage.getItem("WM_SESSION_TOKEN") ||
      localStorage.getItem("WM_SESSION_TOKEN") ||
      ""
    ).trim();

    if (!studentId || !sessionToken) {
      alert("로그인 세션 정보가 없습니다. 다시 로그인해 주세요.");
      return;
    }

    /* WM_LOGIN_TO_MAP_MINIMUM_HANDOFF_V1_20260813
       로그인은 인증만 담당합니다.
       Map에 학생ID + 세션토큰만 전달하고,
       학생정보·현재세트·현재진행은 Map/Code.gs가 자기 공식 DB에서 다시 조회합니다. */
    window.top.location.href =
      WM_MAP_PAGE_URL
      + "?wmEntry=login"
      + "&studentId=" + encodeURIComponent(studentId)
      + "&studentID=" + encodeURIComponent(studentId)
      + "&wmStudentId=" + encodeURIComponent(studentId)
      + "&sessionToken=" + encodeURIComponent(sessionToken)
      + "&wmSessionToken=" + encodeURIComponent(sessionToken)
      + "&WM_SESSION_TOKEN=" + encodeURIComponent(sessionToken);
  }

  function wmBindLoginEnterKey() {
    const idInput = document.getElementById("wmStudentId");
    const pwInput = document.getElementById("wmStudentPw");

    [idInput, pwInput].forEach(function(input) {
      if (!input) return;
      input.addEventListener("keydown", function(e) {
        if (e.key !== "Enter") return;
        e.preventDefault();
        const btn = document.getElementById("wmLoginBtn");
        if (btn && btn.disabled) return;
        window.wmStudentLogin();
      });
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", wmBindLoginEnterKey);
  } else {
    wmBindLoginEnterKey();
  }


  /* ==========================================================
     🔒 WM SPEED LOCK V1 - LOGIN SPEED / 실제 실행 LOCK
     적용대상: 로그인 API 호출·성공 처리·학습맵 즉시 이동
     ========================================================== */
  (function wmApplyLoginSpeedLockV1_(){
    'use strict';

    const VERSION = 'WM_SPEED_LOCK_V1.0';
    const DATE = '2026-07-10';
    const GROUPS = Object.freeze({
      loginSpeed: Object.freeze([
        'wmStudentLogin',
        'wmOpenLearningMap'
      ])
    });

    const results = {};
    let allLocked = true;

    GROUPS.loginSpeed.forEach(function(name){
      const fn = window[name];
      if(typeof fn !== 'function'){
        results[name] = '❌ 함수 없음';
        allLocked = false;
        return;
      }

      try{
        const current = Object.getOwnPropertyDescriptor(window, name);
        if(!current || current.configurable !== false || current.writable !== false){
          Object.defineProperty(window, name, {
            value: fn,
            writable: false,
            configurable: false,
            enumerable: true
          });
        }
      }catch(err){
        results[name] = '❌ LOCK 실패: ' + (err && err.message ? err.message : err);
        allLocked = false;
        return;
      }

      const descriptor = Object.getOwnPropertyDescriptor(window, name);
      const locked = !!descriptor && descriptor.value === fn && descriptor.writable === false && descriptor.configurable === false;
      results[name] = locked ? '✅ ACTUAL LOCK' : '❌ 속성 검증 실패';
      if(!locked) allLocked = false;
    });
